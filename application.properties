server.port=8080
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/cybershield?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:cybershield}
spring.datasource.password=${DB_PASSWORD:cybershield}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jackson.serialization.write-dates-as-timestamps=false
spring.mvc.cors.allowed-origins=${FRONTEND_ORIGIN:http://localhost:5173}
